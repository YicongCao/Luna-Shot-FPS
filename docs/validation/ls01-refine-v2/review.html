<!doctype html><meta charset="utf-8"><title>ML09 原生 Godot 对比</title><style>body{font:16px system-ui;background:#111821;color:#dce5ee;margin:24px}h1{font-size:28px}nav{position:sticky;top:0;background:#18222e;padding:12px;z-index:2}button,select{font:inherit;margin:4px;padding:7px;background:#263747;color:white;border:1px solid #62798b}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0}img{width:100%;background:black}a{color:#60d9ed}.wide{max-width:1600px}small{color:#a4bac9}@media(max-width:900px){main{grid-template-columns:1fr}}</style><h1>ML09 — 枪械结构还原与侧向照明</h1><p>以下均为 Godot 4.7.2 Compatibility 原生截图，1600×1000，同镜头/曝光。结构对比关闭能量与 Bloom。2026-11-16 用户比较三版实机后选择 ML06，默认已回滚 ML06。ML07/ML09 保留对照；以下为当时实施证据，不代表用户认可其视觉升级。</p><p><a href="REPORT.md">检查报告</a> · <a href="../../logs/ML11-枪械视觉倒退复盘与保形原则.md">ML11：为什么返修导致视觉倒退</a> · <a href="../../research/weapon-material-review-2026-11-15/concept.png">目标概念（非实机）</a></p><nav><label>结构视图 <select id="feature"><option value="hero">整体</option><option value="magazine">弹夹右侧</option><option value="magazine-reverse">弹夹左侧</option><option value="magazine-rig-1">弹夹掠射光</option><option value="stock">枪托与双棱</option><option value="stock-reverse">枪托反侧</option><option value="joint">黑白斜接</option><option value="optic">瞄具正面</option><option value="optic-side">瞄具前后鳍片</option><option value="optic-front">瞄具背面</option><option value="screen">异形屏框</option><option value="screen-side">屏幕嵌入</option><option value="coil">护罩与线圈</option><option value="coil-reverse">护罩反侧</option></select></label></nav><main><figure><h2>ML06</h2><a id="link-ml06" href="ml06-pbr-hero.png"><img id="ml06" src="ml06-pbr-hero.png"></a></figure><figure><h2>ML07</h2><a id="link-ml07" href="ml07-pbr-hero.png"><img id="ml07" src="ml07-pbr-hero.png"></a></figure><figure><h2>ML09</h2><a id="link-ml09" href="ml09-pbr-hero.png"><img id="ml09" src="ml09-pbr-hero.png"></a></figure></main><h2>ML09 灰模</h2><figure class="wide"><a id="clay-link" href="ml09-clay-hero.png"><img id="clay" src="ml09-clay-hero.png"></a></figure><h2>侧向补光：同曝光，关闭Bloom</h2><main style="grid-template-columns:1fr 1fr"><figure><p>侧面 -1 · off</p><a href="spill--1-off.png"><img loading="lazy" src="spill--1-off.png"></a></figure><figure><p>侧面 -1 · on</p><a href="spill--1-on.png"><img loading="lazy" src="spill--1-on.png"></a></figure></main><main style="grid-template-columns:1fr 1fr"><figure><p>侧面 1 · off</p><a href="spill-1-off.png"><img loading="lazy" src="spill-1-off.png"></a></figure><figure><p>侧面 1 · on</p><a href="spill-1-on.png"><img loading="lazy" src="spill-1-on.png"></a></figure></main><h2>真实遮挡检查</h2><p>同一只投影、不显示表面的挡板；只切换Spot阴影，检查下游表面照明差异。</p><main style="grid-template-columns:1fr 1fr"><figure><p>阴影 on</p><img loading="lazy" src="spill-blocker-shadow-on.png"></figure><figure><p>阴影 off</p><img loading="lazy" src="spill-blocker-shadow-off.png"></figure></main><h2>实际第一人称</h2><main><figure><p>ammo-13</p><a href="ammo-13.png"><img loading="lazy" src="ammo-13.png"></a></figure><figure><p>ads</p><a href="ads.png"><img loading="lazy" src="ads.png"></a></figure><figure><p>lighting/42-ultrawide</p><a href="lighting/42-ultrawide.png"><img loading="lazy" src="lighting/42-ultrawide.png"></a></figure></main><script>document.querySelector('#feature').onchange=e=>{let f=e.target.value;for(let r of ['ml06','ml07','ml09']){let p=r+'-pbr-'+f+'.png';document.getElementById(r).src=p;document.getElementById('link-'+r).href=p}let c='ml09-clay-'+(f.startsWith('magazine-rig')?'magazine':f)+'.png';document.querySelector('#clay').src=c;document.querySelector('#clay-link').href=c}</script>
