<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Bug 原生结构对照</title>
<style>body{margin:0;background:#141613;color:#e2e5dd;font:16px/1.65 system-ui}main{max-width:1680px;margin:auto;padding:36px 24px 70px}h1,h2{font-weight:500}p{max-width:1000px;color:#adb6a9}a{color:#cfc092}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{font:inherit;padding:8px 18px;background:transparent;color:inherit;border:1px solid #5b6356;cursor:pointer}button[aria-pressed=true]{background:#cfc092;color:#161813}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:18px 0}img{width:100%;display:block}figcaption{padding:8px 0;color:#b5bfae}h2{margin-top:42px}@media(max-width:900px){.pair{grid-template-columns:1fr}}</style></head>
<body><main><h1>T-Bug 原生结构对照</h1><p>同一关卡、机位与暖黄光照。灰模统一使用中性材质和检查补光；材质图不加检查灯。模型由代码构建，沿用已有 imagegen 磨损纹理，无新增模型或图像生成调用。</p><p><a href="REPORT.md">验证与取舍</a> · <a href="../../../launch-benchmark.command">实时 Benchmark</a></p>
<nav aria-label="材质"><button data-material="colour" aria-pressed="true">实际材质</button><button data-material="gray" aria-pressed="false">几何灰模</button></nav>
<nav aria-label="机位"><button data-shot="01-front-left" aria-pressed="true">左前</button><button data-shot="02-front-right" aria-pressed="false">右前</button><button data-shot="03-rear-right" aria-pressed="false">背面</button><button data-shot="04-player-scale" aria-pressed="false">第一人称尺寸</button></nav>
<div class="pair"><figure><a id="old-link" href="final/baseline-colour/01-front-left.png"><img id="old" src="final/baseline-colour/01-front-left.png" alt="旧版同机位"></a><figcaption>旧版</figcaption></figure><figure><a id="new-link" href="final/refined-colour/01-front-left.png"><img id="new" src="final/refined-colour/01-front-left.png" alt="新版同机位"></a><figcaption>分层装甲、关节与嵌入式发光件</figcaption></figure></div>
<h2>实时演示中的近景</h2><figure><img loading="lazy" src="validation/native/03.png" alt="新版T-Bug原生Benchmark近景"><figcaption>当前默认入口实机帧；编排镜头，不是离线渲染。</figcaption></figure>
<h2>真实命中反馈</h2><figure><img loading="lazy" src="validation/feedback/02-hit-inspection.png" alt="真实命中的电击损伤诊断"><figcaption>真实命中回调，诊断图固定在90毫秒；不是静态贴上去的电弧，也不是完整物理破碎。</figcaption></figure>
<p>保留六足、三对独立受损装甲、橙色识别光与原始碰撞/伤害。新造型更硬朗，牺牲部分旧版圆润昆虫轮廓。用户视觉验收待定；截图和测试不等同于3A照片级完成证明。</p></main>
<script>let material='colour',shot='01-front-left';function update(){for(const [id,style] of [['old','baseline'],['new','refined']]){const path=`final/${style}-${material}/${shot}.png`;document.getElementById(id).src=path;document.getElementById(id+'-link').href=path}}document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{material=b.dataset.material;document.querySelectorAll('[data-material]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update()});document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>{shot=b.dataset.shot;document.querySelectorAll('[data-shot]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update()});</script></body></html>
