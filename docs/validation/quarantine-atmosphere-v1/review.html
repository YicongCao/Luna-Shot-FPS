<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖黄氛围原生对照</title><style>body{margin:0;background:#131511;color:#e7e6db;font:16px/1.7 system-ui}main{max-width:1440px;margin:auto;padding:44px 28px 80px}h1{font-size:40px;font-weight:500}h2{font-weight:500;margin-top:48px}p{max-width:980px;color:#bdbeb1}a{color:#d7c79d}nav{display:flex;gap:12px;position:sticky;top:0;padding:14px 0;background:#131511;z-index:2}button{font:inherit;background:transparent;color:#e7e6db;border:1px solid #626253;padding:10px 22px;cursor:pointer}button[aria-pressed=true]{background:#c4ad70;color:#15160e;border-color:#c4ad70}img{width:100%;display:block}figure{margin:24px 0}figcaption{padding:12px 0;color:#aeb09e}.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:800px){.pair{display:block}main{padding:28px 16px}}</style></head><body><main><h1>暖黄氛围原生对照</h1><p>当前 Quarantine 与实时 Benchmark 使用暖黄体积雾、低角度暖光及有限太阳角尺寸。保留新的工业结构、图标 HUD、全息终端和电击反馈，不回退整个旧版本。</p><p><a href="REPORT.md">验证与参数</a> · <a href="../../../launch-benchmark.command">Benchmark 启动脚本</a></p><nav aria-label="画面对照"><button type="button" aria-pressed="true" data-mode="amber">暖黄（当前）</button><button type="button" aria-pressed="false" data-mode="clear">清淡（对照）</button></nav><figure><img data-shot="01-arrival" src="amber/01-arrival.png" alt="入口同机位原生对照"><figcaption>入口：远景雾层与近景剪影。</figcaption></figure><figure><img data-shot="02-fighter-hud" src="amber/02-fighter-hud.png" alt="瞄准与目标可读性"><figcaption>ADS：害虫、准星与飞行仪表风格刻度。</figcaption></figure><figure><img data-shot="05-terminal" src="amber/05-terminal.png" alt="终端同机位原生对照"><figcaption>终端：冷色全息面板与暖色环境分离，保留单一操作界面。</figcaption></figure><figure><img data-shot="06b-reactor-online" src="amber/06b-reactor-online.png" alt="供电恢复同机位原生对照"><figcaption>供电恢复：蓝色能源柱与暖色雾层。</figcaption></figure><h2>制作参照与中间调整</h2><div class="pair"><figure><img loading="lazy" src="../quarantine-v1/first-pass/01-arrival.png" alt="用户偏好的首轮氛围参照"><figcaption>ML22 首轮：用户明确喜欢其中的暖黄末世氛围。历史构图和 HUD 不作为回退对象。</figcaption></figure><figure><img loading="lazy" src="first-amber/01-arrival.png" alt="本轮偏橙的中间版本"><figcaption>本轮第一版：暖色叠加后偏橙、过饱和；最终保留暖雾，调整散射色而非再次冷化。</figcaption></figure></div><p>以上均为 Godot 原生帧；不是概念图或离线渲染。默认入口可直接运行当前暖黄版本；<code>QUARANTINE_ATMOSPHERE=clear ./launch-benchmark.command</code> 查看清淡对照。</p></main><script>document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('img[data-shot]').forEach(img=>img.src=button.dataset.mode+'/'+img.dataset.shot+'.png')}));</script></body></html>
