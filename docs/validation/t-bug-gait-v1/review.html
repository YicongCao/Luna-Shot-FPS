<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML31 · 同步步态对照</title><style>body{max-width:1600px;margin:auto;padding:24px;background:#191919;color:#eee;font:16px/1.6 system-ui}a{color:#9de}section{display:grid;grid-template-columns:1fr 1fr;gap:1em}figure{margin:0}img{width:100%}input{width:min(50vw,500px)}@media(max-width:720px){section{grid-template-columns:1fr}}</style><main><h1>T‑Bug · 落脚对照</h1><p>同一机位、同一段铺装、同样的胶囊运动；观察近侧脚垫相对板缝的位置。<a href="REPORT.md">测量与边界</a></p><section><figure><img id="old" src="baseline-walk-040.webp" alt="原摆腿"><figcaption>原版 · 整条腿绕根部摆动</figcaption></figure><figure><img id="cur" src="default-walk-040.webp" alt="落脚步态"><figcaption>新版 · 支撑脚锁定，髋膝解算</figcaption></figure></section><p><button id="play">播放</button> <label>帧 <input type="range" id="frame" min="0" max="8" value="0"></label> <output id="tick">40</output></p><p>Godot Forward+ 原生脚本化侧拍，约3–4m距离。以60Hz模拟，每5帧抽一张，共九对；循环回跳是对照序列边界。不是完整AI追逐录像，远侧腿遮挡不适合只靠截图判断接触。</p></main><script>const ticks=[40,45,50,55,60,65,70,75,80],slider=document.querySelector('#frame'),button=document.querySelector('#play');let timer=null;const images=['baseline','default'].map(mode=>ticks.map(t=>{const i=new Image();i.src=mode+'-walk-'+String(t).padStart(3,'0')+'.webp';return i}));function show(n){slider.value=n;document.querySelector('#tick').value=ticks[n];document.querySelector('#old').src=images[0][n].src;document.querySelector('#cur').src=images[1][n].src}function stop(){clearInterval(timer);timer=null;button.textContent='播放'}button.onclick=()=>{if(timer){stop();return}button.textContent='暂停';timer=setInterval(()=>show((Number(slider.value)+1)%9),1000/12)};slider.oninput=()=>{stop();show(Number(slider.value))};</script></html>
