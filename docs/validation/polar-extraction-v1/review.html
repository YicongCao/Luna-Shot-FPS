<h1>ML35 · 南极采冰站实机</h1>
<p>Godot 4.7.2，macOS / Metal Forward+。均为正常游戏相机的引擎帧；除出生画面外由验证脚本摆位，非预渲染，也不是无人辅助通关。<a href="REPORT.md">验证报告</a> · <a href="../../design/polar-v1/PLAN.md">路线与玩法</a></p>

<h2>连续原生路线</h2>
<p>自动输入从出生点下生活舱，取记录匣，乘两段货梯，再步行登船。过程中未瞬移玩家、未射击、未推进内部任务状态。</p>
