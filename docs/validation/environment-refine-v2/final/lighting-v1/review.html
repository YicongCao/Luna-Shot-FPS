<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML04 原生光照对照</title><style>body{margin:0;background:#10141a;color:#e6edf5;font:16px system-ui}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:28px}p{color:#aebdcb;line-height:1.7}select,button{font:inherit;background:#243142;color:inherit;padding:10px;border:1px solid #546477;border-radius:6px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;background:#000;display:block}figure{margin:0}figcaption{padding:10px 0;color:#8fd9e9}a{color:#83cdda}@media(max-width:900px){.pair{grid-template-columns:1fr}}</style><main><h1>ML04 · Godot 原生光照对照</h1><p>macOS / Apple M5 / Godot 4.7.2 Compatibility。下面全部是原生运行截图；镜头素材来自 imagegen，位置、强度和遮挡由运行时决定。对照为同机位逐项开关。</p><nav><label>比较项目 <select id="choice"></select></label><button id="swap">交换左右</button><a href="native.json">运行验证与帧时间</a><a href="pixel-comparison.json">像素与 alpha 检查</a><a href="../environment-pipeline-v1/CREDITS.md">690 积分明细</a></nav><div class="pair"><figure><figcaption id="leftTitle"></figcaption><img id="left" alt="对照左侧"></figure><figure><figcaption id="rightTitle"></figcaption><img id="right" alt="对照右侧"></figure></div><p>F6 能量环 / F7 Bloom / F8 镜头光晕 / F9 局部补光。枪械透明视口的原生 Glow 会裁掉轮廓外溢光，最终采用实际画面高亮提取、双向模糊与独立加法合成。首次失败证据保留在 native-alpha-clipping。</p><h2>关卡总览</h2><img src="41-overview.png" alt="最终原生总览"><p><a href="../../logs/ML04-光照与镜头效果.md">制作日志、验证范围及限制</a></p></main><script>const pairs=[['能量环自发光','00-baseline','01-emission','关闭能量','仅开启 Emission'],['邻近材料受光','01-emission','02-local-spill','仅 Emission','加局部补光'],['枪械轮廓外 Bloom','02-local-spill','03a-weapon-bloom-only','无 Bloom','枪械独立 Bloom'],['镜头光条','03-bloom','04-flare','Bloom','加 imagegen 光条'],['设施灯 Bloom','20-lamp-no-bloom','21-lamp-bloom','关闭 Bloom','开启 Bloom'],['设施灯光晕','21-lamp-bloom','22-lamp-flare','仅 Bloom','加镜头光晕'],['太阳遮挡','30-sun-facing','31-sun-occluded','正对太阳','加入遮挡体'],['开镜光晕衰减','50-flare-hip-fixed','51-flare-ads-fixed','固定姿势腰射强度','固定姿势开镜强度 25%'],['太阳侧视 / 背对','32-sun-side','33-sun-behind','侧视','背对']];const select=document.getElementById('choice');pairs.forEach((p,i)=>select.add(new Option(p[0],i)));let swapped=false;function show(){let p=pairs[select.value];document.getElementById('left').src=p[swapped?2:1]+'.png';document.getElementById('right').src=p[swapped?1:2]+'.png';document.getElementById('leftTitle').textContent=p[swapped?4:3];document.getElementById('rightTitle').textContent=p[swapped?3:4]}select.onchange=show;document.getElementById('swap').onclick=()=>{swapped=!swapped;show()};show();</script></html>
