<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 配电机组 · 新旧实机对照</title><style>body{margin:0;background:#121820;color:#e8eef4;font:16px system-ui}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px}p{color:#b4c1cf;line-height:1.7}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}select,button{background:#26384a;color:inherit;font:inherit;padding:9px;border:1px solid #658096;border-radius:5px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0}figcaption{padding:10px 0;color:#86d7e9}img{display:block;width:100%;background:#000}a{color:#9bd4ed}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style><main><h1>A 配电机组 · 概念精修样板</h1><p>全部对照为 Godot 4.7.2 原生截图，同机位、同光照、同材质展示设置。旧版 7,783 三角，新版 5,180 三角；六块顶盖、三扇检修门、侧面接口舱和三根固定线缆，均在原占地内。碰撞与关卡布局保持一致。</p><nav><select id="view"></select><button id="swap">交换左右</button><a href="REPORT.md">实现与验收记录</a><a href="asset-audit.json">几何 / UV / 烘焙审计</a></nav><div class="pair"><figure><figcaption id="a-label">旧版</figcaption><img id="a" alt="旧版实机"></figure><figure><figcaption id="b-label">新版</figcaption><img id="b" alt="新版实机"></figure></div><p>独立视距 3/10/20 m 指相机到正面板的距离；关卡近景位于原有玩家通路。细节可读性随距离变化，不把离线建模图当作游玩效果。</p><h2>概念参考</h2><img src="../../art/environment-concept-v2/concept-board.png" alt="概念参考，非实机"></main><script>const entries=[['0-front','原生三分之四视图'],['0-right','电力接口与线缆'],['0-top','六块顶盖'],['0-back','背面检修盖'],['0-left','左侧'],['range-3m','关卡正面近景'],['range-interface','关卡设备阵列'],['overview','40 个实例的关卡总览'],['distance-3m','独立视距 3 m'],['distance-10m','独立视距 10 m'],['distance-20m','独立视距 20 m'],['1-front','关闭法线对照'],['2-front','统一粗糙度 / 金属度对照']];const view=document.getElementById('view');for(const [key,label] of entries)view.add(new Option(label,key));let reversed=false;function show(){for(const [id,phase] of [['a',reversed?'after':'before'],['b',reversed?'before':'after']]){document.getElementById(id).src=phase+'/'+view.value+'.png';document.getElementById(id+'-label').textContent=phase==='before'?'旧版 · ML03':'新版 · 概念精修'}}view.onchange=show;document.getElementById('swap').onclick=()=>{reversed=!reversed;show()};show();</script></html>
