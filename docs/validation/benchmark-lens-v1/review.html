<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特写与局部照明原生对照</title><style>body{margin:0;background:#151611;color:#e5e4dc;font:16px/1.7 system-ui}main{max-width:1500px;margin:auto;padding:40px 24px 80px}h1,h2{font-weight:500}p{max-width:1050px;color:#babdb0}a{color:#d0c198}nav{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;padding:12px 0;background:#151611}button{font:inherit;background:transparent;border:1px solid #656557;color:#e5e4dc;padding:9px 18px;cursor:pointer}button[aria-pressed=true]{background:#c8b47f;color:#151611}img{display:block;width:100%}figure{margin:20px 0 42px}figcaption{color:#b1b6a6;padding:12px 0}</style></head><body><main><h1>特写与局部照明原生对照</h1><p>同一编排时刻的Godot原生帧。分别检查构图、景深和实体检修灯，不将背景模糊当成模型质量提升。暖黄氛围与全场曝光保持。</p><p><a href="REPORT.md">参数、验证与视觉取舍</a> · <a href="../../../launch-benchmark.command">启动实时 Benchmark</a></p><nav aria-label="对照版本"><button data-mode="baseline" aria-pressed="false">原镜头</button><button data-mode="reframed" aria-pressed="false">仅改构图</button><button data-mode="focused" aria-pressed="false">构图＋景深</button><button data-mode="lit-no-dof" aria-pressed="false">构图＋检修灯</button><button data-mode="final" aria-pressed="true">当前组合</button></nav><figure><a id="image-link" href="published/final/closeup.png"><img id="image" src="published/final/closeup.png" alt="21秒特写原生对照"></a><figcaption id="caption">当前组合：完整主体、局部照明与背景景深。</figcaption></figure><h2>实际战斗保持清晰</h2><figure><img loading="lazy" src="validation/regression/native/02-fighter-hud.png" alt="无演示景深的正常ADS原生画面"><figcaption>检修灯也在正常关卡中生效；战斗、ADS、终端和撤离不启用演示景深。</figcaption></figure><h2>保留宽镜头的空间尺度</h2><figure><img loading="lazy" src="validation/native/01.png" alt="宽镜头与暖黄雾层"><figcaption>开场设施总览未改成特写；暖黄雾层与低角度日照保持。</figcaption></figure><p>以上不是预录视频播放器、离线渲染或用户验收记录。特写含相机与敌人站位编排；真实射击、终端输入、撤离和正常实玩衔接另有运行验证。</p></main><script>const labels={baseline:'原镜头：景深和新增检修灯关闭。',reframed:'仅改构图：调整站位与取景，不增加模糊或补光。',focused:'构图＋景深：主体保持清晰，远景细节淡出。','lit-no-dof':'构图＋检修灯：不加景深，单独检查暗部结构。',final:'当前组合：完整主体、局部照明与背景景深。'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const path='published/'+b.dataset.mode+'/closeup.png';document.getElementById('image').src=path;document.getElementById('image-link').href=path;document.getElementById('caption').textContent=labels[b.dataset.mode]});</script></body></html>
